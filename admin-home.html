<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="IMG/technical_13191571.png" type="image/x-icon" sizes="32x32">
  <title>AutoCare Pro - Panel | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/3d3d423e08.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-roles="ADMINISTRADOR,VENDEDOR" data-menu="home" data-pagina="home">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="menuLateral" aria-label="Menú de administración"></aside>

    <main class="admin-contenido">
      <header class="admin-topbar">
        <button type="button" class="btn btn-sm btn-outline-light d-lg-none" id="btnMenu" aria-label="Abrir menú"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <h1 class="admin-titulo" id="tituloForm">Dashboard</h1>
        <div class="admin-usuario" id="infoUsuario"></div>
      </header>

      <div class="admin-cuerpo">
        <div id="zonaAvisos"></div>

        <section class="admin-card mb-4" aria-labelledby="saludo">
          <h2 class="h3 mb-1" id="saludo"></h2>
          <p class="mb-3">Resumen general de la tienda AutoCare Pro.</p>
          <div class="d-flex flex-wrap gap-2" id="accesos"></div>
        </section>

        <section class="row g-3 mb-4" id="resumen" aria-label="Indicadores"></section>

        <section class="admin-card" aria-labelledby="tituloAlertas">
          <h2 class="h5 mb-3" id="tituloAlertas">Alertas de stock crítico</h2>
          <ul class="list-group list-group-flush" id="alertasStock"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/funciones.js"></script>
  <script src="js/regiones.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
