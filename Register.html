<!DOCTYPE html>
<html> 
    <head>
        
        <title> AutoCare Pro </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/3d3d423e08.js" crossorigin="anonymous"></script>
    </head>
    <body style="background-color: rgb(15, 70, 124);">
        <div class="container mt-3" style="text-align: center; color: rgb(240, 208, 208);">
            <h1> Login AutoCarePro </h1>
        </div>
        <div class="col-md-3 card mt-4 container mt-3 mb-3"; style="text-align: center;">
            <div class="card p-4 shadow-sm">
                <div class="mb-3 text-start">
                    <label for="nombre" class="form-label fw-bold">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre">
                </div>

                <div class="mb-3 text-start">
                    <label for="usuario" class="form-label fw-bold">Usuario:</label>
                    <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario">
                </div>
                
                <div class="mb-3 text-start">
                    <label for="contrasena" class="form-label fw-bold">Contraseña:</label>
                    <input type="password" class="form-control" id="contrasena" placeholder="Ingrese su contraseña">
                </div>

                <div class="mb-3 text-start">
                    <label for="email" class="form-label fw-bold">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingrese su email">
                </div>

                <button onclick="registrar()" class="btn btn-primary w-100 mt-2"> Registrar </button>
            </div>
        </div>
        
    </body>
    
</html>
