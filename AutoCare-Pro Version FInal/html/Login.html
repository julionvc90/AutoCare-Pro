<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="IMG/technical_13191571.png" type="image/x-icon" sizes="32x32">
  <title>AutoCare Pro - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/3d3d423e08.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="top-bar-actions">
    <div class="container d-flex justify-content-end align-items-center gap-3">
      <a href="Login.html" class="btn-top-login">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        <span>Iniciar Sesión</span>
      </a>

      <button class="btn-top-cart" type="button" id="btnCarrito" aria-expanded="false" aria-controls="panelCarrito">
        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        <span>Carrito</span>
        <span class="cart-badge" id="contadorCarrito">0</span>
      </button>

      <div class="cart-panel" id="panelCarrito" hidden>
        <div class="cart-panel-header">
          <h2 class="h6 mb-0">Productos en tu carrito</h2>
          <button type="button" class="cart-close" id="cerrarCarrito" aria-label="Cerrar carrito">&times;</button>
        </div>

        <div id="listaCarrito" class="cart-list">
          <p class="cart-empty mb-0">El carrito está vacío.</p>
        </div>

        <div class="cart-panel-footer">
          <span>Total:</span>
          <strong id="totalCarrito">$0</strong>
        </div>

        <a href="index.html" class="btn btn-success btn-sm w-100 mt-3">Ver carrito completo</a>
      </div>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="index.html" aria-label="Ir al inicio de AutoCare Pro">
        <img src="IMG/Logo.png" alt="AutoCare Pro" width="15%">
        <span class="auto">AUTO</span>
        <span class="care">CARE</span>
        <span class="pro">Pro</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navTienda" aria-controls="navTienda" aria-expanded="false" aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navTienda">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="SobreNosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="Catalogo.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="Blogs.html">Blogs</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <br><br>

    <div class="row justify-content-center g-4">

      <!-- LOGIN -->
      <div class="col-12 col-md-5">
        <div class="text-center mb-3">
          <h1 class="h3"><i class="fas fa-user"></i> Iniciar Sesión</h1>
        </div>

        <form id="loginForm" class="card p-4 shadow-sm" novalidate>
          <div class="mb-3 text-start">
            <label for="usuario" class="form-label fw-bold">Correo*</label>
            <input type="email" class="form-control" id="usuario" placeholder="tucorreo@duoc.cl" required>
          </div>

          <div class="mb-3 text-start">
            <label for="password" class="form-label fw-bold">Contraseña*</label>
            <input type="password" class="form-control" id="password" placeholder="Entre 4 y 10 caracteres" required>
          </div>

          <p id="loginMensaje" class="mb-3"></p>

          <button type="submit" class="btn btn-primary w-100 mt-2">Iniciar Sesión</button>
        </form>
      </div>

      <!-- REGISTRO -->
      <div class="col-12 col-md-5">
        <div class="text-center mb-3">
          <h1 class="h3"><i class="fas fa-user-plus"></i> Registrarse</h1>
        </div>

        <form id="registerForm" class="card p-4 shadow-sm" novalidate>
          <div class="mb-3 text-start">
            <label for="regNombre" class="form-label fw-bold">Nombre*</label>
            <input type="text" class="form-control" id="regNombre" placeholder="Ingrese su nombre" required>
          </div>

          <div class="mb-3 text-start">
            <label for="regCorreo" class="form-label fw-bold">Correo*</label>
            <input type="email" class="form-control" id="regCorreo" placeholder="tucorreo@duoc.cl" required>
          </div>

          <div class="mb-3 text-start">
            <label for="regPassword" class="form-label fw-bold">Contraseña*</label>
            <input type="password" class="form-control" id="regPassword" placeholder="Entre 4 y 10 caracteres" required>
          </div>

          <p id="registerMensaje" class="mb-3"></p>

          <button type="submit" class="btn btn-primary w-100 mt-2">Registrar</button>
        </form>
      </div>

    </div>

    
  </div>
  <footer class="text-center py-5 mt-5">
    <p class="mb-0 small">© 2026 AutoCare Pro - Repuestos y Accesorios Automotrices</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/funciones.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
