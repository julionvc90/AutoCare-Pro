<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="IMG/technical_13191571.png" type="image/x-icon" sizes="32x32">
  <title>AutoCare Pro - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/3d3d423e08.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

  <div class="top-bar-actions">
    <div class="container d-flex justify-content-end align-items-center gap-3">
      <a href="Login.html" class="btn-top-login">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        <span>Iniciar Sesión</span>
      </a>

      <button class="btn-top-cart" type="button" id="btnCarrito" aria-expanded="false" aria-controls="panelCarrito">
        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        <span>Carrito</span>
        <span class="cart-badge" id="contadorCarrito">0</span>
      </button>

      <div class="cart-panel" id="panelCarrito" hidden>
        <div class="cart-panel-header">
          <h2 class="h6 mb-0">Productos en tu carrito</h2>
          <button type="button" class="cart-close" id="cerrarCarrito" aria-label="Cerrar carrito">&times;</button>
        </div>

        <div id="listaCarrito" class="cart-list">
          <p class="cart-empty mb-0">El carrito está vacío.</p>
        </div>

        <div class="cart-panel-footer">
          <span>Total:</span>
          <strong id="totalCarrito">$0</strong>
        </div>

        <a href="index.html" class="btn btn-success btn-sm w-100 mt-3">Ver carrito completo</a>
      </div>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="index.html" aria-label="Ir al inicio de AutoCare Pro">
        <img src="IMG/Logo.png" alt="AutoCare Pro" width="15%">
        <span class="auto">AUTO</span>
        <span class="care">CARE</span>
        <span class="pro">Pro</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navTienda" aria-controls="navTienda" aria-expanded="false" aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navTienda">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link nav-link-custom" href="SobreNosotros.html">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link nav-link-custom" href="Catalogo.html">Productos</a></li>
            <li class="nav-item"><a class="nav-link nav-link-custom" href="blogs.html">Blogs</a></li>
            <li class="nav-item"><a class="nav-link nav-link-custom" href="contacto.html">Contacto</a></li>

        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center g-4">
      <div class="col-lg-5">
        <div class="auth-card card h-100">
          <div class="auth-card-body card-body">
            <div class="text-center">
              <div class="auth-icon">
                <i class="fa-solid fa-user"></i>
              </div>
              <h1 class="h3 text-white mb-4">Iniciar sesión</h1>
            </div>

            <form id="loginForm" novalidate>
              <div class="form-grupo">
                <label for="loginUsuario">Usuario o correo</label>
                <input id="loginUsuario" type="text" placeholder="Ej: admin o cliente@autocarepro.cl" required>
              </div>

              <div class="form-grupo">
                <label for="loginPassword">Contraseña</label>
                <input id="loginPassword" type="password" placeholder="Ingresa tu contraseña" required>
              </div>

              <div id="loginMensaje" class="auth-message" aria-live="polite"></div>
              <button type="submit" class="btn btn-success w-100 mt-3">Ingresar</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="auth-card card h-100">
          <div class="auth-card-body card-body">
            <div class="text-center">
              <div class="auth-icon">
                <i class="fa-solid fa-user-plus"></i>
              </div>
              <h2 class="h3 text-white mb-4">Crear cuenta</h2>
            </div>

            <form id="registerForm" novalidate>
              <div class="form-grupo">
                <label for="registerNombre">Nombre completo</label>
                <input id="registerNombre" type="text" placeholder="Tu nombre" required>
              </div>

              <div class="form-grupo">
                <label for="registerUsuario">Usuario</label>
                <input id="registerUsuario" type="text" placeholder="Nombre de usuario" required>
              </div>

              <div class="form-grupo">
                <label for="registerEmail">Correo electrónico</label>
                <input id="registerEmail" type="email" placeholder="tuemail@ejemplo.com" required>
              </div>

              <div class="form-grupo">
                <label for="registerPassword">Contraseña</label>
                <input id="registerPassword" type="password" placeholder="Crea una contraseña" required>
              </div>

              <div id="registerMensaje" class="auth-message" aria-live="polite"></div>
              <button type="submit" class="btn btn-outline-success w-100 mt-3">Registrarme</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-5 mt-5">
    <p class="mb-0 small">© 2026 AutoCare Pro - Repuestos y Accesorios Automotrices</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
